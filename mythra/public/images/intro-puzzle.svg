<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Earn the ridge code — solar sequence, glyphs and hatch keypad">
  <defs>
    <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070714"/><stop offset="0.55" stop-color="#3b1428"/><stop offset="1" stop-color="#7c2d1e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#psky)"/>
  <rect y="360" width="800" height="140" fill="#1c0a06"/>
  <g>
    <circle cx="400" cy="180" r="120" fill="#0b0605" stroke="#ffb45e" stroke-width="6"/>
    <circle cx="400" cy="180" r="96" fill="none" stroke="#ff6b35" stroke-width="2" stroke-dasharray="10 8"/>
    <g font-family="monospace" font-size="34" fill="#ffd9a8" text-anchor="middle">
      <text x="400" y="120">☉ VII</text>
      <text x="480" y="190">⋈ 11</text>
      <text x="400" y="256">ᚦ IV</text>
      <text x="320" y="190">◬ 1001</text>
    </g>
    <circle cx="400" cy="180" r="10" fill="#ffb45e"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <rect x="90" y="150" width="130" height="180" rx="10" fill="#2a140c" stroke="#ffb45e" stroke-width="4"/>
    <rect x="108" y="170" width="94" height="40" rx="4" fill="#0b0605" stroke="#9aa7bd" stroke-width="2"/>
    <text x="155" y="198" font-family="monospace" font-size="22" fill="#7ddf9a" text-anchor="middle">VII·11</text>
    <g font-family="monospace" font-size="20" fill="#f5ecdd" text-anchor="middle">
      <text x="125" y="250">1</text><text x="155" y="250">2</text><text x="185" y="250">3</text>
      <text x="125" y="280">4</text><text x="155" y="280">5</text><text x="185" y="280">6</text>
      <text x="125" y="310">7</text><text x="155" y="310">8</text><text x="185" y="310">9</text>
    </g>
  </g>
  <g>
    <rect x="580" y="150" width="130" height="180" rx="10" fill="#1d4ed8" stroke="#9aa7bd" stroke-width="4"/>
    <circle cx="615" cy="200" r="14" fill="#fbbf24"/><circle cx="660" cy="200" r="14" fill="#3a3f4d" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="615" cy="245" r="14" fill="#3a3f4d" stroke="#fbbf24" stroke-width="3"/><circle cx="660" cy="245" r="14" fill="#fbbf24"/>
    <circle cx="615" cy="290" r="14" fill="#fbbf24"/><circle cx="660" cy="290" r="14" fill="#3a3f4d" stroke="#fbbf24" stroke-width="3"/>
  </g>
  <path d="M0 380 H800" stroke="#ffb45e" stroke-width="2" stroke-dasharray="14 10" opacity="0.7"/>
